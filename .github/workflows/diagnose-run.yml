name: Read failed regression artifact
on:
  push:
    branches: [codex/v43-l2-ci-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37992427059
          name: regression-diagnostics
          path: /tmp/omm-original-diagnostics
      - name: Publish original log in check annotations
        shell: bash
        run: |
          node <<'JS'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/omm-original-diagnostics/omm-regression.log','utf8');
          const escape=x=>x.replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          for(let i=0;i<raw.length;i+=5000)process.stdout.write(`::warning title=Original regression log ${i/5000}::${escape(raw.slice(i,i+5000))}\n`);
          JS
