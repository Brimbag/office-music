name: Regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/omm-regression.log
      - name: Preserve regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: /tmp/omm-regression.log
      - name: Generation benchmark smoke (mock APIs, no timing threshold)
        run: node tests/benchmarks/generation-pipeline.mjs > /tmp/generation-benchmark.json
        env:
          OMM_BENCH_REPETITIONS: '1'
