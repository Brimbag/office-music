name: Regression
on: [push, pull_request]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Read original post-merge diagnostics
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 37992427059
          name: regression-diagnostics
          path: /tmp/omm-original-diagnostics
      - name: Expose original failure as a warning
        run: node tests/helpers/ci-failures.mjs /tmp/omm-original-diagnostics/omm-regression.log warning
      - name: Regression tests
        shell: bash
        run: |
          set -o pipefail
          trap 'node tests/helpers/ci-failures.mjs /tmp/omm-regression.log' EXIT
          npm test 2>&1 | tee /tmp/omm-regression.log
      - name: Preserve regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics
          path: /tmp/omm-regression.log
      - name: Generation benchmark smoke (mock APIs, no timing threshold)
        run: node tests/benchmarks/generation-pipeline.mjs > /tmp/generation-benchmark.json
        env:
          OMM_BENCH_REPETITIONS: '1'
