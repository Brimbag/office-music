<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Music Mixer</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      padding: 12px 18px;
      margin: 6px 6px 6px 0;
      font-size: 16px;
      cursor: pointer;
    }

    .box {
      margin-top: 24px;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .ok {
      color: green;
    }

    .error {
      color: darkred;
    }

    code {
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>Office Music Mixer</h1>
  <p>Test połączenia ze Spotify.</p>

  <button id="loginButton">Połącz ze Spotify</button>
  <button id="logoutButton" style="display:none;">Wyloguj</button>
  <button id="createPlaylistButton" style="display:none;">
  Utwórz testową playlistę
  </button>
  
  <div class="box">
    <strong>Status:</strong>
    <div id="status">Niepołączony</div>
  </div>

  <div class="box" id="profileBox" style="display:none;">
    <strong>Konto Spotify:</strong>
    <div id="profile"></div>
  </div>

  <div class="box" id="playlistBox" style="display:none;">
    <strong>Playlista testowa:</strong>
    <div id="playlistResult"></div>
  </div>
  
<script>
const clientId = "d207523201ce4426923cda4cc893f76f";
const redirectUri = "https://brimbag.github.io/office-music/";

const scopes = [
  "user-read-private",
  "user-read-playback-state",
  "user-modify-playback-state",
  "playlist-read-private",
  "playlist-modify-private",
  "playlist-modify-public",
  "user-read-recently-played"
];

const loginButton = document.getElementById("loginButton");
const logoutButton = document.getElementById("logoutButton");
const statusBox = document.getElementById("status");
const profileBox = document.getElementById("profileBox");
const profileDiv = document.getElementById("profile");

const createPlaylistButton =
  document.getElementById("createPlaylistButton");

const playlistBox =
  document.getElementById("playlistBox");

const playlistResult =
  document.getElementById("playlistResult");

createPlaylistButton.addEventListener(
  "click",
  createTestPlaylist
);
  
loginButton.addEventListener("click", login);
logoutButton.addEventListener("click", logout);

function randomString(length = 64) {
  const chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

  const array = new Uint32Array(length);
  crypto.getRandomValues(array);

  return Array.from(
    array,
    n => chars[n % chars.length]
  ).join("");
}

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  return crypto.subtle.digest("SHA-256", data);
}

function base64UrlEncode(buffer) {
  return btoa(
    String.fromCharCode(...new Uint8Array(buffer))
  )
    .replace(/\+/g, "-")
    .replace(/\//g, "_")
    .replace(/=+$/, "");
}

async function login() {
  const codeVerifier = randomString(64);
  const codeChallenge =
    base64UrlEncode(await sha256(codeVerifier));

  const state = randomString(32);

  localStorage.setItem(
    "spotify_code_verifier",
    codeVerifier
  );

  sessionStorage.setItem(
    "spotify_auth_state",
    state
  );

  const authUrl =
    new URL("https://accounts.spotify.com/authorize");

  authUrl.search = new URLSearchParams({
    response_type: "code",
    client_id: clientId,
    scope: scopes.join(" "),
    redirect_uri: redirectUri,
    code_challenge_method: "S256",
    code_challenge: codeChallenge,
    state: state
  }).toString();

  window.location.href = authUrl.toString();
}

async function exchangeCodeForToken(code) {
  const codeVerifier =
    localStorage.getItem("spotify_code_verifier");

  if (!codeVerifier) {
    throw new Error(
      "Brak code verifier. Rozpocznij logowanie ponownie."
    );
  }

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        client_id: clientId,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: redirectUri,
        code_verifier: codeVerifier
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    console.error(data);

    throw new Error(
      "Nie udało się pobrać tokenu Spotify."
    );
  }

  saveTokens(data);

  localStorage.removeItem(
    "spotify_code_verifier"
  );

  return data.access_token;
}

function saveTokens(data) {
  localStorage.setItem(
    "spotify_access_token",
    data.access_token
  );

  localStorage.setItem(
    "spotify_token_expires",
    String(
      Date.now() +
      data.expires_in * 1000 -
      60000
    )
  );

  if (data.refresh_token) {
    localStorage.setItem(
      "spotify_refresh_token",
      data.refresh_token
    );
  }
}

async function refreshAccessToken() {
  const refreshToken =
    localStorage.getItem(
      "spotify_refresh_token"
    );

  if (!refreshToken) {
    return null;
  }

  const response = await fetch(
    "https://accounts.spotify.com/api/token",
    {
      method: "POST",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded"
      },
      body: new URLSearchParams({
        grant_type: "refresh_token",
        refresh_token: refreshToken,
        client_id: clientId
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    console.error(data);

    clearTokens();

    return null;
  }

  saveTokens(data);

  return data.access_token;
}

async function getValidAccessToken() {
  const token =
    localStorage.getItem(
      "spotify_access_token"
    );

  const expires =
    Number(
      localStorage.getItem(
        "spotify_token_expires"
      )
    );

  if (token && expires > Date.now()) {
    return token;
  }

  return await refreshAccessToken();
}

async function getProfile(token) {
  const response = await fetch(
    "https://api.spotify.com/v1/me",
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  if (!response.ok) {
    throw new Error(
      "Nie udało się odczytać profilu Spotify."
    );
  }

  return response.json();
}

async function showLoggedIn(token) {
  const profile = await getProfile(token);

  statusBox.innerHTML =
    '<span class="ok">Połączono ze Spotify ✓</span>';

  profileDiv.textContent = "";

  const name =
    document.createElement("strong");

  name.textContent =
    profile.display_name ||
    "Użytkownik Spotify";

  const id =
    document.createElement("p");

  id.textContent =
    `ID: ${profile.id}`;

  const account =
    document.createElement("p");

  account.textContent =
    `Konto: ${profile.product || "brak informacji"}`;

  profileDiv.append(
    name,
    id,
    account
  );

  profileBox.style.display = "block";

  loginButton.style.display = "none";
  logoutButton.style.display = "inline-block";
  createPlaylistButton.style.display = "inline-block";
}

async function createTestPlaylist() {
  try {
    createPlaylistButton.disabled = true;
    createPlaylistButton.textContent =
      "Tworzę playlistę...";

    const token =
      await getValidAccessToken();

    if (!token) {
      throw new Error(
        "Brak aktywnej sesji Spotify."
      );
    }

    const response = await fetch(
      "https://api.spotify.com/v1/me/playlists",
      {
        method: "POST",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          name: "Office Music Mixer - test",
          public: false,
          description:
            "Test playlisty utworzonej przez Office Music Mixer."
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      console.error(data);

      throw new Error(
        `Spotify zwrócił błąd ${response.status}.`
      );
    }

    const testQueries = [
  "Pearl Jam Alive",
  "Fleetwood Mac Dreams",
  "Green Day Basket Case",
  "The Cranberries Zombie",
  "David Bowie Heroes"
];

const tracks = [];

for (const query of testQueries) {
  const track =
    await searchTrack(token, query);

  tracks.push(track);
}

await addItemsToPlaylist(
  token,
  data.id,
  tracks.map(
    track => track.uri
  )
);
    playlistResult.textContent = "";

    const title =
      document.createElement("p");

title.textContent =
  `Utworzono: ${data.name}`;

const trackList =
  document.createElement("ul");

for (const track of tracks) {
  const li =
    document.createElement("li");

  li.textContent =
    `${track.artists
      .map(a => a.name)
      .join(", ")} - ${track.name}`;

  trackList.appendChild(li);
}

const link =
  document.createElement("a");

link.href =
  data.external_urls.spotify;

link.target = "_blank";
link.rel = "noopener noreferrer";
link.textContent =
  "Otwórz playlistę w Spotify";

playlistResult.append(
  title,
  trackList,
  link
);

playlistBox.style.display = "block";

  } catch (err) {
    console.error(err);

    playlistResult.textContent =
      err.message;

    playlistBox.style.display = "block";

  } finally {
    createPlaylistButton.disabled = false;
    createPlaylistButton.textContent =
      "Utwórz testową playlistę";
  }
}

async function searchTrack(token, query) {
  const url = new URL(
    "https://api.spotify.com/v1/search"
  );

  url.search = new URLSearchParams({
    q: query,
    type: "track",
    limit: "1"
  }).toString();

  const response = await fetch(
    url,
    {
      headers: {
        Authorization: `Bearer ${token}`
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {
    console.error(data);
    throw new Error(
      `Błąd wyszukiwania Spotify: ${response.status}`
    );
  }

  const track =
    data.tracks?.items?.[0];

  if (!track) {
    throw new Error(
      `Nie znaleziono utworu: ${query}`
    );
  }

  return track;
}

async function addItemsToPlaylist(
  token,
  playlistId,
  uris
) {
  const response = await fetch(
    `https://api.spotify.com/v1/playlists/${playlistId}/items`,
    {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        uris: uris
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    console.error(data);

    throw new Error(
      `Nie udało się dodać utworów: ${response.status}`
    );
  }

  return data;
}
  
function clearTokens() {
  localStorage.removeItem(
    "spotify_access_token"
  );

  localStorage.removeItem(
    "spotify_refresh_token"
  );

  localStorage.removeItem(
    "spotify_token_expires"
  );

  localStorage.removeItem(
    "spotify_code_verifier"
  );

  sessionStorage.removeItem(
    "spotify_auth_state"
  );
}

function logout() {
  clearTokens();
  window.location.href = redirectUri;
}

async function init() {
  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
    params.get("code");

  const returnedState =
    params.get("state");

  const error =
    params.get("error");

  if (error) {
    statusBox.innerHTML =
      `<span class="error">
        Spotify zwrócił błąd: ${error}
      </span>`;

    return;
  }

  if (code) {
    const expectedState =
      sessionStorage.getItem(
        "spotify_auth_state"
      );

    if (
      !expectedState ||
      returnedState !== expectedState
    ) {
      clearTokens();

      statusBox.innerHTML =
        '<span class="error">Błąd weryfikacji logowania.</span>';

      return;
    }

    try {
      statusBox.textContent =
        "Kończę logowanie...";

      const token =
        await exchangeCodeForToken(code);

      sessionStorage.removeItem(
        "spotify_auth_state"
      );

      window.history.replaceState(
        {},
        document.title,
        redirectUri
      );

      await showLoggedIn(token);

      return;

    } catch (err) {
      console.error(err);

      statusBox.innerHTML =
        `<span class="error">${err.message}</span>`;

      return;
    }
  }

  try {
    const token =
      await getValidAccessToken();

    if (token) {
      await showLoggedIn(token);
    } else {
      statusBox.textContent =
        "Niepołączony";
    }

  } catch (err) {
    console.error(err);

    clearTokens();

    statusBox.innerHTML =
      '<span class="error">Sesja Spotify wygasła. Zaloguj się ponownie.</span>';
  }
}

init();
</script>

</body>
</html>
